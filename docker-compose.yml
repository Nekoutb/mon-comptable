services:
  frontend:
    build: .
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    depends_on: [api]
  api:
    build: ./backend
    ports: ["8000:8000"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes: ["documents:/data/documents"]
  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    depends_on: [postgres, redis]
    volumes: ["documents:/data/documents"]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mon_comptable
      POSTGRES_USER: mon_comptable
      POSTGRES_PASSWORD: change-me
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mon_comptable"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis:/data"]

volumes:
  postgres:
  redis:
  documents:
